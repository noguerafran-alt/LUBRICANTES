name: modelos3d

# Foto → GLB con Blender headless (tools/modelos3d.py). Va aparte de recolectar: no hace falta a diario.
on:
  workflow_dispatch:
    inputs:
      limite:
        description: Cuántos modelos generar
        default: "5"
      solo:
        description: producto_id puntual (opcional)
        default: ""
      forzar:
        description: Regenerar aunque el GLB ya exista
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: recolectar  # comitea en el mismo repo que los datos: de a una
  cancel-in-progress: false

jobs:
  modelos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Blender 5.3.0
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1
          curl -fsSL -o /tmp/blender.tar.xz https://download.blender.org/release/Blender5.3/blender-5.3.0-linux-x64.tar.xz
          echo "dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05  /tmp/blender.tar.xz" | sha256sum -c -
          mkdir /tmp/blender && tar -xf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
      - name: Self-test
        run: /tmp/blender/blender -b --factory-startup -P tools/modelos3d.py -- test
      - name: Generar
        env:
          LIMITE: ${{ inputs.limite }}
          SOLO: ${{ inputs.solo }}
          FORZAR: ${{ inputs.forzar }}
        run: |
          args=(--limite "$LIMITE")
          [ -n "$SOLO" ] && args+=(--solo "$SOLO")
          [ "$FORZAR" = "true" ] && args+=(--forzar)
          /tmp/blender/blender -b --factory-startup -P tools/modelos3d.py -- "${args[@]}"
      - name: Comitear site/modelos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p site/modelos && git add -A site/modelos
          git diff --cached --quiet && exit 0
          git commit -m "modelos 3D $(date -u +%F)"
          git pull --rebase
          git push

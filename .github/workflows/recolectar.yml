name: recolectar

on:
  schedule:
    - cron: "0 13 * * *"  # 10:00 ART (el recolector de casa corre a las 06:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 50  # ML con token ~14 min + cotización de envíos ~13 min (tope propio de 22: ENVIOS_SEGUNDOS)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # El canje de ML rota el refresh: si después no se puede guardar, se pierde (pasó el 2026-11-04 con un PAT sin
      # permiso de Secrets). Se prueba ANTES que GH_PAT llega a los secrets; si no, ML no corre y el token queda intacto.
      # ponytail: solo prueba lectura de la clave pública; un PAT con Secrets "read-only" pasaría. Darle "Read and write".
      - name: Chequear GH_PAT
        id: pat
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ] && gh api "repos/$GITHUB_REPOSITORY/actions/secrets/public-key" --silent; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GH_PAT falta o no tiene permiso Secrets read/write sobre este repo: ML no corre (el refresh no se canjea)"
          fi
      # El recolector de casa (celular o PC, 06:00 ART) deja una fila fuente=casa con la fecha de hoy en data/fuentes.csv. Si está, la Action
      # corre SOLO Mercado Libre; si no (el celu no corrió), corre todo lo que sirva desde GitHub como respaldo.
      - name: Ver si el recolector de casa ya corrió hoy
        id: modo
        run: |
          hoy=$(TZ=America/Argentina/Buenos_Aires date +%F)
          if grep -q "^$hoy,casa," data/fuentes.csv; then
            echo "casa=1" >> "$GITHUB_OUTPUT"
            echo "El recolector de casa ya corrió el $hoy: solo Mercado Libre"
          else
            echo "::warning::El recolector de casa no corrió el $hoy: corre todo como respaldo"
          fi
      - name: Recolectar
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ steps.pat.outputs.ok == '1' && secrets.ML_REFRESH_TOKEN || '' }}
        run: |
          if [ "${{ steps.modo.outputs.casa }}" = "1" ]; then python recolectar.py --solo ml; else python recolectar.py; fi
      # El refresh de ML es de un solo uso: si el canje rotó, hay que guardarlo aunque falle lo demás.
      - name: Rotar refresh token ML
        if: always() && hashFiles('.ml_refresh_nuevo') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          trap 'rm -f .ml_refresh_nuevo' EXIT
          gh secret set ML_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < .ml_refresh_nuevo
      # Series de datos.gob.ar (INDEC, SE, BCRA): barato y el tipo de cambio es diario. Una serie vacía queda en fuentes.csv, no rompe el job.
      - name: Series de mercado
        if: always() && steps.modo.outputs.casa != '1'
        run: python macro.py series
      # Dólar PTAX del BCB (BRL por USD) para mostrar Brasil en USD. Ventana de 10 días: la del día sale después de las 13 h. Si cae, queda en fuentes.csv.
      - name: Tipo de cambio (BCB PTAX)
        if: always() && steps.modo.outputs.casa != '1'
        run: python macro.py fx
      - name: Comitear data/
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "datos $(date -u +%F): $([ "${{ steps.modo.outputs.casa }}" = "1" ] && echo ml || echo recolectar)"
          # el celu puede pushear en el medio: rebase y reintento
          # ponytail: si el celu tocó el mismo archivo de data/ en el medio, el rebase conflictúa y el job falla (ventana de horas: casa 06:00, Action 10:00)
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

  # SEPA y las ventas de la SE (macro.py energia, ~770 MB) no corren acá: bloquean IP de datacenter (SEPA 403, datos.energia.gob.ar timeout).
  # Las corre el recolector de casa (tools/recolector_casa.py, celular con Termux o PC; ver CLAUDE.md y docs/celular.md de CELU-SERVIDOR). Nota Paraná está pausada y
  # además se saltea sola en este recorrido (recolectar.FUENTES_PC con GITHUB_ACTIONS=true).

name: recolectar

on:
  schedule:
    - cron: "0 9 * * *"  # 06:00 ART
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # ML con token tarda ~14 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # El canje de ML rota el refresh: si después no se puede guardar, se pierde (pasó el 2026-11-04 con un PAT sin
      # permiso de Secrets). Se prueba ANTES que GH_PAT llega a los secrets; si no, ML no corre y el token queda intacto.
      # ponytail: solo prueba lectura de la clave pública; un PAT con Secrets "read-only" pasaría. Darle "Read and write".
      - name: Chequear GH_PAT
        id: pat
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ] && gh api "repos/$GITHUB_REPOSITORY/actions/secrets/public-key" --silent; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GH_PAT falta o no tiene permiso Secrets read/write sobre este repo: ML no corre (el refresh no se canjea)"
          fi
      - name: Recolectar
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ steps.pat.outputs.ok == '1' && secrets.ML_REFRESH_TOKEN || '' }}
        run: python recolectar.py
      # El refresh de ML es de un solo uso: si el canje rotó, hay que guardarlo aunque falle lo demás.
      - name: Rotar refresh token ML
        if: always() && hashFiles('.ml_refresh_nuevo') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          trap 'rm -f .ml_refresh_nuevo' EXIT
          gh secret set ML_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < .ml_refresh_nuevo
      # Series de datos.gob.ar (INDEC, SE, BCRA): barato y el tipo de cambio es diario. Una serie vacía queda en fuentes.csv, no rompe el job.
      - name: Series de mercado
        if: always()
        run: python macro.py series
      # Dólar PTAX del BCB (BRL por USD) para mostrar Brasil en USD. Ventana de 10 días: la del día sale después de las 13 h. Si cae, queda en fuentes.csv.
      - name: Tipo de cambio (BCB PTAX)
        if: always()
        run: python macro.py fx
      - name: Comitear data/
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "datos $(date -u +%F): recolectar"
          git pull --rebase
          git push

  # SEPA, Nota Paraná y las ventas de la SE (macro.py energia, ~770 MB) no corren acá: bloquean IP de datacenter (SEPA 403, Nota Paraná
  # 0 productos, datos.energia.gob.ar timeout). Las corre tools/sepa_pc.py desde la PC (tarea LUBRICANTES-SEPA; ver CLAUDE.md, «Fuentes desde
  # la PC»). Nota Paraná además se saltea sola en este recorrido (recolectar.FUENTES_PC con GITHUB_ACTIONS=true) para no dejar una fila de error.
